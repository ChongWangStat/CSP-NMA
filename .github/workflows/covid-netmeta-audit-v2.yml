name: covid-netmeta-audit-v2

on:
  push:
    branches:
      - analysis/covid-netmeta-2026-10-02
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install netmeta
        run: |
          Rscript -e 'install.packages("netmeta", repos="https://cloud.r-project.org")'
      - name: Run COVID netmeta audit
        run: |
          Rscript analysis/covid_netmeta_compare_v2.R
