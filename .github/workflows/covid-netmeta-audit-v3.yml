name: covid-netmeta-audit-current

on:
  push:
    branches:
      - analysis/covid-netmeta-fast-2026-10-04
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk40 libglpk-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true
      - name: Install current netmeta 3.7-0
        run: |
          Rscript -e 'install.packages("remotes", repos="https://cloud.r-project.org"); remotes::install_version("netmeta", version="3.7-0", upgrade="never", dependencies=NA)'
      - name: Run corrected COVID netmeta audit
        run: |
          Rscript analysis/covid_netmeta_compare_v4.R
      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: covid-netmeta-audit-current-v4
          path: |
            covid_*v4.csv
          if-no-files-found: error
