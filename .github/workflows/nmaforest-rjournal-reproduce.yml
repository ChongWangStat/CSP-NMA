name: nmaforest-rjournal-reproduction

on:
  push:
    branches:
      - analysis/nmaforest-rjournal-2026-10-04
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk40 libglpk-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true
      - name: Install exact package versions
        run: |
          Rscript -e 'install.packages("remotes", repos="https://cloud.r-project.org"); remotes::install_version("igraph", version="2.1.4", upgrade="never", dependencies=TRUE); remotes::install_version("netmeta", version="3.2-0", upgrade="never", dependencies=TRUE); remotes::install_version("NMAforest", version="0.1.3", upgrade="never", dependencies=TRUE)'
      - name: Run R Journal binary reproduction
        run: |
          Rscript analysis/nmaforest_rjournal_reproduce.R
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: nmaforest-rjournal-reproduction
          path: |
            nmaforest_*csv
          if-no-files-found: error
