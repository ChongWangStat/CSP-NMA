name: psoriasis-source-probe

on:
  push:
    branches:
      - analysis/psoriasis-audit-2026-10-04
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true
      - name: Install multinma
        run: |
          Rscript -e 'install.packages("multinma", repos="https://cloud.r-project.org")'
      - name: Export psoriasis source candidate
        run: |
          Rscript analysis/psoriasis_source_probe.R
      - name: Upload source candidate
        uses: actions/upload-artifact@v4
        with:
          name: psoriasis-source-probe
          path: |
            multinma_plaque_psoriasis_*.csv
          if-no-files-found: error
