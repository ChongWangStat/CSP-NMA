name: covid-netmeta-temp-audit

on:
  push:
    branches:
      - analysis/covid-netmeta-2026-10-02
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("netmeta","dplyr","ggplot2","plotly"), repos="https://cloud.r-project.org")'
      - name: Run COVID contribution audit
        run: |
          Rscript analysis/covid_netmeta_compare.R
